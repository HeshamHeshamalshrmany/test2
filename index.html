<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة التحكم عن بعد عبر تليجرام</title>
    <style>
        body { background: #0b0e14; color: #00ffcc; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #161b22; padding: 15px; text-align: center; font-size: 16px; border-bottom: 1px solid #30363d; font-weight: bold; }
        #terminal { flex-grow: 1; background: #010409; margin: 10px; border-radius: 8px; border: 1px solid #30363d; padding: 12px; overflow-y: auto; font-size: 13px; text-align: left; direction: ltr; }
    </style>
</head>
<body>

    <header>محطة الاستقبال والتحكم الآلي</header>

    <div id="terminal">
        [System] Initializing Telegram Bridge...<br>
        [System] Connecting to bot: @my_e_control_2026_bot...<br>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const BOT_TOKEN = "8175556330:AAGP0GZf10h0H_Fc10NJAbKJpP-zOH0xFwM";
        let lastUpdateId = 0;

        function log(msg) {
            terminal.innerHTML += `<br>> ${msg}`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        // الحفاظ على الشاشة نشطة دائماً
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').then(() => {
                log("Screen Wake Lock active: Device will not sleep.");
            }).catch(err => {
                log("Wake Lock error: " + err.message);
            });
        }

        // دالة لجلب الأوامر الجديدة من بوت تليجرام تلقائياً كل 3 ثوانٍ
        function pollTelegramUpdates() {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=30`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.ok && data.result.length > 0) {
                        data.result.forEach(update => {
                            lastUpdateId = update.update_id;
                            if (update.message && update.message.text) {
                                const text = update.message.text.trim();
                                log(`Received command: "${text}"`);
                                executeCommand(text);
                            }
                        });
                    }
                })
                .catch(err => {
                    // تجاهل أخطاء الشبكة المؤقتة والاستمرار
                })
                .finally(() => {
                    setTimeout(pollTelegramUpdates, 3000);
                });
        }

        // تنفيذ الأمر الوارد من تليجرام على الهاتف المعطل
        function executeCommand(cmd) {
            if (cmd === '/ping' || cmd === 'hi') {
                log("Command executed: Pong! Device is online.");
            } else if (cmd === '/scroll_down') {
                window.scrollBy({ top: 400, behavior: 'smooth' });
                log("Executed: Scrolled down.");
            } else if (cmd === '/scroll_up') {
                window.scrollBy({ top: -400, behavior: 'smooth' });
                log("Executed: Scrolled up.");
            } else if (cmd === '/refresh') {
                log("Refreshing page...");
                setTimeout(() => location.reload(), 1000);
            } else {
                log(`Unknown command: ${cmd}`);
            }
        }

        // بدء مراقبة الأوامر فور تحميل الصفحة
        log("Listening for commands from Telegram bot...");
        pollTelegramUpdates();
    </script>
</body>
</html>
