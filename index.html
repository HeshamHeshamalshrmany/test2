<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المتقدمة</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #1f1f1f; padding: 15px; text-align: center; font-size: 18px; border-bottom: 1px solid #333; }
        #touchpad { flex-grow: 1; background: #1e1e1e; margin: 15px; border-radius: 12px; border: 2px dashed #444; display: flex; justify-content: center; align-items: center; text-align: center; font-size: 20px; color: #aaa; touch-action: none; position: relative; }
        #touchpad.active { background: #1b3b22; border-color: #4CAF50; color: #4CAF50; }
        .nav-bar { display: flex; justify-content: space-around; padding: 15px; background: #1f1f1f; border-top: 1px solid #333; }
        .btn { background: #333; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; flex: 1; margin: 0 5px; }
        .btn:active { background: #4CAF50; }
    </style>
</head>
<body>

    <header>لوحة التحكم بالهاتف المعطل</header>

    <div id="touchpad">
        منطقة اللمس والتحكم<br><span style="font-size: 14px; color: #666;">(المس وحرك إصبعك هنا)</span>
    </div>

    <div class="nav-bar">
        <button class="btn" onclick="triggerAction('back')">رجوع</button>
        <button class="btn" onclick="triggerAction('home')">الرئيسية</button>
        <button class="btn" onclick="triggerAction('click')">نقرة</button>
    </div>

    <script>
        const touchpad = document.getElementById('touchpad');

        touchpad.addEventListener('touchstart', (e) => {
            touchpad.classList.add('active');
            touchpad.innerText = "جاري التوجيه واللمس...";
        });

        touchpad.addEventListener('touchend', (e) => {
            touchpad.classList.remove('active');
            touchpad.innerText = "منطقة اللمس والتحكم\n(المس وحرك إصبعك هنا)";
        });

        function triggerAction(action) {
            if(action === 'back') {
                window.history.back();
            } else if(action === 'home') {
                window.location.href = 'https://www.google.com'; // مؤقتاً للعودة للبداية
            } else {
                alert('تم تنفيذ النقرة!');
            }
        }
    </script>
</body>
</html>
