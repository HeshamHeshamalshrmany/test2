<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة التحكم المتقدمة عبر الويب</title>
    <style>
        body { background: #0a0a0a; color: #00ff66; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #111; padding: 15px; text-align: center; font-size: 16px; border-bottom: 1px solid #222; }
        
        #terminal { flex-grow: 1; background: #000; margin: 10px; border-radius: 8px; border: 1px solid #00ff66; padding: 10px; overflow-y: auto; font-size: 14px; text-align: left; direction: ltr; }
        
        .control-panel { padding: 10px; background: #111; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #222; }
        .row { display: flex; gap: 8px; }
        
        .btn { background: #00ff66; color: #000; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; }
        .btn:active { background: #00cc52; }
    </style>
</head>
<body>

    <header>محطة التحكم والربط المباشر</header>

    <div id="terminal">
        [System] Initializing web control interface...<br>
        [System] Waiting for bridge connection...<br>
    </div>

    <div class="control-panel">
        <div class="row">
            <button class="btn" onclick="sendPing()">إرسال نبضة تنشيط (Ping)</button>
            <button class="btn" onclick="forceWakeLock()">إبقاء الشاشة نشطة</button>
        </div>
        <div class="row">
            <button class="btn" onclick="triggerAutoRefresh()">تحديث إجباري للرابط</button>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');

        function log(msg) {
            terminal.innerHTML += `<br>> ${msg}`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function sendPing() {
            log("Sending active signal to browser session...");
            // محاولة إرسال طلب داخلي لإبقاء الجلسة حية
            fetch(window.location.href, { mode: 'no-cors' })
                .then(() => log("Signal sent successfully."))
                .catch(err => log("Signal error: " + err));
        }

        async function forceWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    const wakeLock = await navigator.wakeLock.request('screen');
                    log("Wake Lock active: Screen will stay awake.");
                } else {
                    log("Wake Lock API not supported on this browser.");
                }
            } catch (err) {
                log(`Wake Lock error: ${err.name}, ${err.message}`);
            }
        }

        function triggerAutoRefresh() {
            log("Refreshing interface context...");
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        }

        // تشغيل ميزة إبقاء الشاشة نشطة تلقائياً عند فتح الصفحة
        forceWakeLock();
    </script>
</body>
</html>
