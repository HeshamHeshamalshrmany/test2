<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touch Test</title>
    <style>
        body { background: black; color: white; height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; font-family: sans-serif; font-size: 24px; }
    </style>
</head>
<body ontouchstart="this.style.background='green'; this.innerText='تم رصد اللمس بنجاح!';" ontouchend="this.style.background='black'; this.innerText='المس الشاشة هنا';">
    المس الشاشة هنا
</body>
</html>
